[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggle-prep"
version = "0.5"
description = "One-command Kaggle dataset preparation, profiling, visualization & starter notebook generation tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Sumit Gavali", email = "sumitrg0007@gmail.com"}
]
keywords = ["kaggle", "data-science", "cli", "eda", "data-profiling", "automation", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "kagglehub>=0.2.0",
    "kaggle>=1.5.12",
    "pandas>=1.3.0",
    "numpy>=1.22.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.0.0",
]
excel = [
    "openpyxl>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
all = [
    "kaggle-prep[ml,excel,dev]",
]

[project.urls]
Homepage = "https://github.com/SumitGavali/CLI-DataAnalysis"
Repository = "https://github.com/SumitGavali/CLI-DataAnalysis"
Issues = "https://github.com/SumitGavali/CLI-DataAnalysis/issues"

[project.scripts]
kaggle-prep = "kaggle_prep.cli:main"

[tool.setuptools.packages.find]
include = ["kaggle_prep*"]
exclude = ["tests*", "docs*", "data*", "reports*", "eda_plots*", "notebooks*", "data_profiles*", "dist*"]

[tool.setuptools.package-data]
kaggle_prep = ["*.py"]